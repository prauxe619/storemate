# Project-wide Gradle settings.

# ============================================================
# GRADLE
# ============================================================

org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# org.gradle.parallel=true


# ============================================================
# ANDROIDX
# ============================================================

android.useAndroidX=true
android.enableJetifier=true


# ============================================================
# REACT NATIVE ARCHITECTURES
# ============================================================

reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64


# ============================================================
# REACT NATIVE NEW ARCHITECTURE
# ============================================================
#
# TEMPORARY DIAGNOSTIC SETTING
#
# We are disabling Fabric/New Architecture to determine whether
# the repeated voice-command crash is caused by Fabric.
#
# After the crash is diagnosed, we can turn this back to true.
#

newArchEnabled=false


# ============================================================
# HERMES
# ============================================================

hermesEnabled=true


# ============================================================
# EDGE TO EDGE
# ============================================================

edgeToEdgeEnabled=false


# ============================================================
# RELEASE SIGNING
# ============================================================

MYAPP_UPLOAD_STORE_FILE=storemate-release-key.keystore
MYAPP_UPLOAD_KEY_ALIAS=storemate-key
MYAPP_UPLOAD_STORE_PASSWORD=storemate619@
MYAPP_UPLOAD_KEY_PASSWORD=storemate619@