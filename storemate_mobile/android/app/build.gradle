apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native configuration
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}


/**
 * ProGuard / R8
 *
 * TRUE = smaller optimized release APK
 */
def enableProguardInReleaseBuilds = true


/**
 * JavaScriptCore fallback
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'


android {

    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.storemate_mobile"


    /*
     * ========================================================
     * CMAKE
     * ========================================================
     */

    externalNativeBuild {
        cmake {
            buildStagingDirectory "C:/temp/storemate_cxx"
        }
    }


    /*
     * ========================================================
     * DEFAULT CONFIG
     * ========================================================
     */

    defaultConfig {

        applicationId "com.storemate_mobile"

        minSdkVersion rootProject.ext.minSdkVersion

        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode 1

        versionName "1.0.0"
    }


    /*
     * ========================================================
     * SIGNING
     * ========================================================
     */

    signingConfigs {

        debug {

            storeFile file('debug.keystore')

            storePassword 'android'

            keyAlias 'androiddebugkey'

            keyPassword 'android'
        }


        release {

            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {

                storeFile file(
                    MYAPP_UPLOAD_STORE_FILE
                )

                storePassword =
                    MYAPP_UPLOAD_STORE_PASSWORD

                keyAlias =
                    MYAPP_UPLOAD_KEY_ALIAS

                keyPassword =
                    MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }


    /*
     * ========================================================
     * BUILD TYPES
     * ========================================================
     */

    buildTypes {

        debug {

            signingConfig signingConfigs.debug
        }


        release {

            signingConfig signingConfigs.release

            minifyEnabled =
                enableProguardInReleaseBuilds

            proguardFiles(
                getDefaultProguardFile(
                    "proguard-android.txt"
                ),
                "proguard-rules.pro"
            )
        }
    }


    /*
     * ========================================================
     * CUSTOM APK FILE NAME
     * ========================================================
     *
     * Release output:
     *
     * Countr-v1.0.0-release.apk
     *
     */

    applicationVariants.all { variant ->

        variant.outputs.all { output ->

            def appName =
                "Countr"

            def versionNameValue =
                variant.versionName ?: "1.0.0"

            outputFileName =
                "${appName}-v${versionNameValue}-${variant.name}.apk"
        }
    }
}


/*
 * ============================================================
 * HERMES
 * ============================================================
 */

ext.hermesEnabled = "true"


/*
 * ============================================================
 * DEPENDENCIES
 * ============================================================
 */

dependencies {

    implementation(
        "com.facebook.react:react-android"
    )


    if (hermesEnabled.toBoolean()) {

        implementation(
            "com.facebook.react:hermes-android"
        )

    } else {

        implementation jscFlavor
    }


    /*
     * SQLCipher
     */

    implementation(
        'net.zetetic:android-database-sqlcipher:4.5.3'
    )

    implementation(
        "androidx.sqlite:sqlite:2.3.1"
    )
}