name: Build Storemate Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: storemate_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storemate_mobile/package-lock.json

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -storetype PKCS12 -keystore android/app/storemate-release-key.keystore \
          -alias storemate-key -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=StoreMate, OU=Dev, O=StoreMate, L=Gurugram, S=Haryana, C=IN" \
          -storepass storemate123 -keypass storemate123

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=storemate-release-key.keystore \
            -Pandroid.injected.signing.store.password=storemate123 \
            -Pandroid.injected.signing.key.alias=storemate-key \
            -Pandroid.injected.signing.key.password=storemate123

      - name: Upload Storemate APK
        uses: actions/upload-artifact@v4
        with:
          name: storemate-release-apk
          path: storemate_mobile/android/app/build/outputs/apk/release/app-release.apk
