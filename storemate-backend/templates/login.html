{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
    <h2 class="text-2xl font-bold text-gray-900 mb-2 text-center">Super Admin Login</h2>
    <p class="text-gray-500 text-sm mb-6 text-center">Access global network analytics and store management.</p>
    
    <form action="{{ url_for('admin_web.login') }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Admin Email</label>
            <input type="email" name="email" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition text-sm">Log In to Console</button>
    </form>
</div>
{% endblock %}
