version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: storemate_postgres
    restart: always
    environment:
      POSTGRES_USER: storemate_admin
      POSTGRES_PASSWORD: secretpassword123
      POSTGRES_DB: storemate_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: storemate_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: